      <h1 class="hero-name">MohammadAmin Sadeghi</h1>
      <p class="hero-role">Architectural &amp; Data Center Designer</p>
      <p class="lede">I design data centers and the architecture around them — rack plates, containment, cooling and service routes worked out against buildings that are already standing, then documented so they can be built.</p>
      <h2 class="h3">Selected projects</h2>
      <ul>
        <li>Modular Data Center — containerised facility modelled end to end in BIM</li>
        <li>Two-Level Facility — two documented hall levels inside one building envelope</li>
        <li>Technical Level, 48 Racks — two contained technical rooms and eight 20-ton cooling units</li>
        <li>Rack Room Reorganisation — an existing room reorganised into a 24-rack hall</li>
        <li>Existing Hall Conversion — one contained pod of 24 rack positions against a fixed column grid</li>
        <li>The Last Shadow of Time — a museum of memory, time and light</li>
        <li>Data Hall Retrofit — 24 cabinets in two facing rows with a 1.20 m contained aisle</li>
        <li>Outdoor Tennis &amp; Volleyball Complex — two courts set into a sloping site</li>
        <li>Ramsar Urban Baseline Study — baseline and site analysis of Ramsar</li>
      </ul>
